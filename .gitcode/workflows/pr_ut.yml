name: UT Job

on:
  workflow_call:
    inputs:
      docker_img:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      jdk_version:
        required: true
        type: string

jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    runs-on: [self-hosted, openeuler, arm, cpu=32]
    container:
      image: ${{ inputs.docker_img }}
    env:
      jdk_version: ${{ inputs.jdk_version }}
    steps:
      # save 端 key 每次运行唯一且不给 restore-keys，靠"全部未命中即落盘"写新缓存；restore 端精确 key 故意永不等于 save 端，只靠前缀取最近一份
      - name: ccache_tag
        id: cct
        run: |-
          printf 'tag=%s\n' "${ATOMGIT_RUN_ID:-$(date +%s)}" >> "$ATOMGIT_OUTPUT"
      - name: restore_ccache
        uses: cache
        with:
          path: /home/jenkins/agent/build_cache/.ccache
          key: ccache-coverage-hit-${{ steps.cct.outputs.tag }}
          restore-keys: |
            ccache-coverage-
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
          path: OmniOperatorJIT           # 与下方脚本路径一致；init_env 不依赖目录名
      - name: build
        run: |-
          if [ -f OmniOperatorJIT/.gitcode/scripts/OmniOperator_build.sh ]; then
            bash OmniOperatorJIT/.gitcode/scripts/OmniOperator_build.sh coverages_cpp
          else
            echo "ERROR: OmniOperator_build.sh 在预合入代码中均不存在"; exit 1
          fi
      - name: save_ccache
        uses: cache
        with:
          path: /home/jenkins/agent/build_cache/.ccache
          key: ccache-coverage-${{ steps.cct.outputs.tag }}
