name: OmniOperator Version BuildFlow

on:
  workflow_dispatch:
    inputs:
      OmniOperator_branch:
        description: '检出构建脚本所在的 OmniOperator 分支，默认 master'
        required: false
        default: 'master'
        type: string
      Product_Version:
        description: ''
        required: false
        default: '26.3.RC1'
        type: string
  schedule:
    - cron: '0 8 25 11 *'    # UTC+8，11 月 25 日 08:00 触发一次，校验 YAML 配置是否合规
env:
  docker_img_openeuler2203: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler_22.03_lts_sp3:omnioperator_arm_02
  docker_img_openeuler2403: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler_24.03_lts_sp3:omnioperator_arm_02

stages: # 阶段，不超过16个阶段，不超过256个job
  stage1: # stage identifier 仅支持大小写英文字母、数字、“-”或“_”
    name: 全量编译
    select: selected_by_default
    jobs: # 任务，单 stage 下最多100个；不写 needs 即同阶段并行
      OmniOperator_openEuler2203_JDK8:
        name: OmniOperator openEuler22.03 JDK8
        uses: .gitcode/workflows/version_build_omnioperator.yaml
        with:
          docker_img: ${{ env.docker_img_openeuler2203 }}
          module: openEuler22.03_JDK8
          jdk_version: '8'
          OmniOperator_branch: ${{ inputs.OmniOperator_branch || 'master' }}
          Product_Version: ${{ inputs.Product_Version || '26.3.RC1' }}
      OmniOperator_openEuler2203_JDK17:
        name: OmniOperator openEuler22.03 JDK17
        uses: .gitcode/workflows/version_build_omnioperator.yaml
        with:
          docker_img: ${{ env.docker_img_openeuler2203 }}
          module: openEuler22.03_JDK17
          jdk_version: '17'
          OmniOperator_branch: ${{ inputs.OmniOperator_branch || 'master' }}
          Product_Version: ${{ inputs.Product_Version || '26.3.RC1' }}
